# Include inside the existing HTTPS server {} for the game.
# Replace its previous root and location blocks; keep TLS/certificate settings.
root /var/www/jumpGame/dist;
index index.html;
server_tokens off;
client_max_body_size 8k;
add_header X-Content-Type-Options nosniff always;

# Never expose the unauthenticated maintenance endpoint to the internet.
location = /api/resetLeaderboard {
    return 404;
}

location /api/ {
    limit_req zone=jumpgame_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

location ~ /\. {
    return 404;
}

# Vite's fingerprinted build files can be cached for a long time.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# Literal media URLs are not fingerprinted: revalidate after each deployment.
location /src/assets/ {
    expires -1;
    try_files $uri =404;
}

location / {
    expires -1;
    try_files $uri $uri/ =404;
}
